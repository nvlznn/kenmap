<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KenMap</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6b68;
    --line: #e2e2de; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
    --grey: #c3c3bf;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --panel: #1f2023; --ink: #ececeb; --muted: #9a9a96;
      --line: #2e3034; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --grey: #4a4c50;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 20px 24px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .total { font-size: 30px; font-weight: 600; letter-spacing: -.02em; margin-left: auto; }
  .total small { font-size: 13px; font-weight: 400; color: var(--muted); display: block; text-align: right; }
  main { display: grid; grid-template-columns: 1fr 320px; min-height: calc(100vh - 66px); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { border-left: none !important; border-top: 1px solid var(--line); } }
  svg { width: 100%; height: 100%; display: block; }
  .node { cursor: pointer; }
  .node text { font-size: 12px; font-weight: 500; pointer-events: none; }
  .node .pct { font-size: 11px; opacity: .75; }
  .node circle { transition: stroke-width .12s ease; }
  .node.selected circle { stroke: var(--ink); stroke-width: 3; }
  aside { border-left: 1px solid var(--line); padding: 20px; background: var(--panel); }
  aside h2 { font-size: 15px; margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: 13px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .row span:first-child { color: var(--muted); }
  .answers { margin-top: 18px; }
  .answer { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .answer b { font-weight: 600; }
  .answer p { margin: 6px 0 0; color: var(--muted); }
  code { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-size: 12px; }
  .warn { margin: 12px 24px 0; padding: 10px 12px; border-radius: 8px; font-size: 13px;
          background: #fff5d6; color: #6b4e00; border: 1px solid #f0dda0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .warn { background: #3a3000; color: #f0dda0; border-color: #5c4d00; } }
  .empty { padding: 48px 24px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="repo">KenMap <span>— comprehension map</span></h1>
  <div class="total"><span id="total">—</span><small id="totalNote">no answers recorded yet</small></div>
</header>
<div id="warnings"></div>
<main>
  <div id="graph"></div>
  <aside>
    <h2 id="panelTitle">Pick a module</h2>
    <p class="hint" id="panelHint">Node size is lines of code. Colour is how much of it you can still explain.</p>
    <div id="panelBody"></div>
  </aside>
</main>
<script>
const REMOTE_BRANCH = 'kenmap-data';

function colorFor(score, quizzed) {
  if (!quizzed) return getComputedStyle(document.documentElement).getPropertyValue('--grey').trim();
  const stops = [[0, [211, 74, 62]], [0.5, [214, 166, 48]], [1, [58, 158, 94]]];
  let [a, b] = [stops[0], stops[1]];
  if (score > 0.5) [a, b] = [stops[1], stops[2]];
  const t = (score - a[0]) / (b[0] - a[0] || 1);
  const mix = a[1].map((v, i) => Math.round(v + (b[1][i] - v) * t));
  return `rgb(${mix.join(',')})`;
}

/** Layered by dependency depth: things other modules lean on sink to the bottom. */
function layout(modules, edges, width, height) {
  const depth = new Map(modules.map((m) => [m.id, 0]));
  for (let pass = 0; pass < modules.length; pass++) {
    let moved = false;
    for (const e of edges) {
      const want = depth.get(e.from) + 1;
      if (depth.has(e.to) && depth.get(e.to) < want) { depth.set(e.to, want); moved = true; }
    }
    if (!moved) break;
  }
  const rows = new Map();
  for (const m of modules) {
    const d = depth.get(m.id);
    if (!rows.has(d)) rows.set(d, []);
    rows.get(d).push(m);
  }
  const ranks = [...rows.keys()].sort((a, b) => a - b);
  const positions = new Map();
  const rowGap = height / (ranks.length + 1);
  ranks.forEach((rank, i) => {
    const row = rows.get(rank);
    const colGap = width / (row.length + 1);
    row.forEach((m, j) => positions.set(m.id, { x: colGap * (j + 1), y: rowGap * (i + 1) }));
  });
  return positions;
}

function render(report) {
  document.getElementById('repo').innerHTML =
    `KenMap <span>— ${report.repo ? report.repo : 'comprehension map'}</span>`;
  const pct = Math.round(report.total * 100);
  document.getElementById('total').textContent = report.anyQuizzed ? pct + '%' : '—';
  document.getElementById('totalNote').textContent = report.anyQuizzed
    ? 'weighted by lines of code'
    : 'no answers recorded yet';

  const warnBox = document.getElementById('warnings');
  warnBox.innerHTML = (report.warnings || [])
    .map((w) => `<div class="warn">${escapeHtml(w)}</div>`).join('');

  const host = document.getElementById('graph');
  if (!report.modules.length) {
    host.innerHTML = '<div class="empty">No modules configured yet — run <code>/comprehend init</code>.</div>';
    return;
  }
  const width = Math.max(host.clientWidth || 720, 360);
  const height = Math.max(host.clientHeight || 520, 420);
  const positions = layout(report.modules, report.edges || [], width, height);
  const maxLoc = Math.max(...report.modules.map((m) => m.loc), 1);
  const radius = (loc) => 22 + 44 * Math.sqrt(loc / maxLoc);

  const edgeSvg = (report.edges || []).map((e) => {
    const a = positions.get(e.from); const b = positions.get(e.to);
    if (!a || !b) return '';
    const w = Math.min(6, 1 + Math.log2(e.weight + 1));
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--line)"
            stroke-width="${w}" marker-end="url(#arrow)"><title>${escapeHtml(e.from)} → ${escapeHtml(e.to)} (${e.weight})</title></line>`;
  }).join('');

  const nodeSvg = report.modules.map((m) => {
    const p = positions.get(m.id); const r = radius(m.loc);
    const label = m.quizzed ? Math.round(m.score * 100) + '%' : 'not quizzed';
    return `<g class="node" data-id="${escapeHtml(m.id)}" transform="translate(${p.x},${p.y})">
      <circle r="${r}" fill="${colorFor(m.score, m.quizzed)}" stroke="var(--panel)" stroke-width="2"></circle>
      <text text-anchor="middle" y="-2" fill="#fff">${escapeHtml(m.id)}</text>
      <text text-anchor="middle" y="14" class="pct" fill="#fff">${label}</text>
    </g>`;
  }).join('');

  host.innerHTML = `<svg viewBox="0 0 ${width} ${height}">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"></path></marker></defs>
    ${edgeSvg}${nodeSvg}</svg>`;

  host.querySelectorAll('.node').forEach((node) => {
    node.addEventListener('click', () => {
      host.querySelectorAll('.node').forEach((n) => n.classList.remove('selected'));
      node.classList.add('selected');
      showModule(report.modules.find((m) => m.id === node.dataset.id));
    });
  });
}

function showModule(module) {
  document.getElementById('panelTitle').textContent = module.id;
  document.getElementById('panelHint').textContent = module.quizzed
    ? 'Averaged over the answers below.'
    : 'Never quizzed — it counts as zero until you are.';

  const rows = [
    ['score', module.quizzed ? Math.round(module.score * 100) + '%' : '—'],
    ['lines', module.loc.toLocaleString()],
    ['files', module.fileCount],
  ];
  if (module.generatedFiles) rows.push(['generated files', module.generatedFiles]);

  const answers = module.breakdown.map((b) => {
    const churn = b.churn === null
      ? '<b>churn unverifiable</b> — the commit you were quizzed at is gone'
      : `churn <b>${Math.round(b.churn * 100)}%</b> since you answered`;
    const recovered = b.baseline && b.baseline.recovered
      ? '<p>Baseline recovered by timestamp after a history rewrite.</p>' : '';
    return `<div class="answer">
      <b>${b.quizScore * 100}%</b> answered ${new Date(b.at).toLocaleDateString()} → counts as
      <b>${Math.round(b.score * 100)}%</b><p>${churn}</p>${recovered}</div>`;
  }).join('');

  document.getElementById('panelBody').innerHTML =
    rows.map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('') +
    `<div class="answers">${answers || '<p class="hint">No answers yet.</p>'}</div>` +
    `<p class="hint">Quiz it with <code>/comprehend ${escapeHtml(module.id)}</code></p>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function boot() {
  if (window.__REPORT__) return render(window.__REPORT__);

  const repo = new URLSearchParams(location.search).get('repo');
  if (!repo) {
    document.getElementById('graph').innerHTML =
      '<div class="empty">Open this page with <code>?repo=owner/name</code>, or let <code>/comprehend</code> open it locally.</div>';
    return;
  }
  try {
    // Fetch by commit SHA: raw.githubusercontent caches branch names hard.
    const branch = await fetch(`https://api.github.com/repos/${repo}/branches/${REMOTE_BRANCH}`);
    if (!branch.ok) throw new Error(branch.status === 404
      ? `no ${REMOTE_BRANCH} branch in ${repo} — has it been published yet?`
      : `GitHub API said ${branch.status}` + (branch.status === 403 ? ' (rate limit, try again later)' : ''));
    const sha = (await branch.json()).commit.sha;
    const data = await fetch(`https://raw.githubusercontent.com/${repo}/${sha}/report.json`);
    if (!data.ok) throw new Error(`report.json missing at ${sha.slice(0, 7)}`);
    const report = await data.json();
    report.repo = repo;
    render(report);
  } catch (err) {
    document.getElementById('graph').innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
  }
}

boot();
addEventListener('resize', () => { if (window.__REPORT__) render(window.__REPORT__); });
</script>
</body>
</html>
